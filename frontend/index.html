<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uy Elon - @uychinoz</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div class="app">
        <header class="header">
            <div class="header-content">
                <h1>🏠 Uy Elon</h1>
            </div>
        </header>

        <main class="main">
            <div id="add-page" class="page active">
                <div class="page-header">
                    <h2>➕ Yangi E'lon</h2>
                    <p class="subtitle">Uyingizni e'lon qiling</p>
                </div>
                <form id="add-house-form" class="form">
                    <div class="form-group">
                        <label>Sarlavha *</label>
                        <input type="text" id="house-title" placeholder="Masalan: 2 xonali kvartira" data-required="Sarlavha kiritilishi shart">
                    </div>
                    <div class="form-group">
                        <label>Tavsif</label>
                        <textarea id="house-description" rows="3" placeholder="Uy haqida qo'shimcha ma'lumot"></textarea>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Narx *</label>
                            <input type="number" id="house-price" placeholder="Masalan: 150000000" data-required="Narx kiritilishi shart">
                        </div>
                        <div class="form-group">
                            <label>Valyuta *</label>
                            <select id="house-currency" data-required="Valyuta tanlanishi shart">
                                <option value="">Tanlang</option>
                                <option value="UZS">So'm</option>
                                <option value="USD">USD ($)</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Manzil</label>
                        <input type="text" id="house-city" placeholder="Masalan: Toshkent viloyati, Chinoz tumani">
                    </div>
                    <div class="form-group">
                        <label>E'lon muddati</label>
                        <select id="house-expiration">
                            <option value="">Tanlang</option>
                            <option value="1">1 oy</option>
                            <option value="3">3 oy</option>
                            <option value="6">6 oy</option>
                            <option value="12">1 yil</option>
                        </select>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Joylashuv turi</label>
                            <select id="house-location-type">
                                <option value="">Tanlang</option>
                                <option value="shahar">Shahar</option>
                                <option value="shahar-atrofi">Shaxar atrofi</option>
                                <option value="qishloq">Qishloq</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Uy turi</label>
                            <select id="house-type">
                                <option value="">Tanlang</option>
                                <option value="kvartira">Kvartira</option>
                                <option value="xonadon">Xonadon</option>
                                <option value="cottaj">Cottaj</option>
                                <option value="uy">Dom</option>
                                <option value="noturar-joy">Noturar joy</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Maydon (m²)</label>
                            <input type="number" id="house-area" placeholder="Masalan: 65">
                        </div>
                        <div class="form-group">
                            <label>Xonalar soni</label>
                            <input type="number" id="house-rooms" placeholder="Masalan: 2">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Qavat</label>
                            <input type="number" id="house-floor" placeholder="Masalan: 3">
                        </div>
                        <div class="form-group">
                            <label>Umumiy qavatlar</label>
                            <input type="number" id="house-total-floors" placeholder="Masalan: 5">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Holati</label>
                        <select id="house-condition">
                            <option value="">Tanlang</option>
                            <option value="yangi">Yangi</option>
                            <option value="tamirlangan">Ta'mirlangan</option>
                            <option value="tamir-talab">Ta'mir talab</option>
                            <option value="o-rtacha">O'rtacha</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Uy jihozlar</label>
                        <select id="house-furniture">
                            <option value="">Tanlang</option>
                            <option value="bor">Bor</option>
                            <option value="yoq">Yo'q</option>
                            <option value="qisman">Qisman</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Kommunal xizmatlar</label>
                        <select id="house-utilities">
                            <option value="">Tanlang</option>
                            <option value="gaz-suv-elektr">Gaz, Suv, Elektr</option>
                            <option value="gaz-elektr">Gaz, Elektr</option>
                            <option value="elektr">Faqat Elektr</option>
                        </select>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Qurilgan yili</label>
                            <input type="number" id="house-year" placeholder="Masalan: 2020">
                        </div>
                        <div class="form-group">
                            <label>Garaj</label>
                            <select id="house-garage">
                                <option value="">Tanlang</option>
                                <option value="bor">Bor</option>
                                <option value="yoq">Yo'q</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Telefon raqam *</label>
                        <input type="tel" id="house-phone" placeholder="+998 90 123 45 67" data-required="Telefon raqam kiritilishi shart">
                    </div>
                    <div class="form-group">
                        <label>Rasmlar (maksimal 8 ta)</label>
                        <input type="file" id="house-image" accept="image/*" multiple style="display: none;">
                        <div id="file-input-label" onclick="document.getElementById('house-image').click()" style="padding: 1rem; border: 2px dashed var(--tg-theme-hint-color); border-radius: 8px; text-align: center; cursor: pointer; color: var(--tg-theme-hint-color);">
                            Tanlanmagan
                        </div>
                        <div id="image-preview" style="margin-top: 0.5rem; display: none; gap: 0.5rem; flex-wrap: wrap;">
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary" id="submit-btn">E'lon qo'shish</button>
                    <div id="loading-message" style="display: none; text-align: center; margin-top: 1rem; color: var(--tg-theme-hint-color);">
                        ⏳ Qo'shilmoqda...
                    </div>
                </form>
            </div>
        </main>
    </div>

    <script src="js/telegram.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
